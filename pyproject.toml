[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-crypto-identity-attestor"
version = "0.1.0"
description = "Verifiable cryptographic agent identity, ephemeral delegation tokens, and challenge-response authentication"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-crypto-identity-attestor = "agent_crypto_identity_attestor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_crypto_identity_attestor*"]
